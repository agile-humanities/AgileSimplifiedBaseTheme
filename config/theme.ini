[info]
name = "Simplified Agile Base Theme"
version = "2.0.0-dev"
author = "Agile Humanities Agency"
description = "A drop-in theme for any Omeka S site, generated from the Advanced Agile Base Theme. Plain CSS and CSS variables; no modules or build step required."
;theme_link = ""
author_link = "https://agilehumanities.ca/"
omeka_version_constraint = "^4.2.0"

; Agile theme declaration, read by the Agile Theme Tools module when it is installed (this theme does not need it).
; Keep these keys if you copy or rename the theme. There is no agile_build key: this theme has no SASS build.
agile_base = "agile-base-simplified"
agile_base_version = "2.0.0-dev"
